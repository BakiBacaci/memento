# Codemagic — iOS derlemesi ve App Store Connect'e (TestFlight) yükleme.
#
# Windows'ta iOS derlenemediği için iOS sürümü burada, bulutta, macOS
# makinede derleniyor. Ücretsiz planda ayda 500 dakika macOS derlemesi var;
# bir derleme ~15-20 dk sürer.
#
# Kurulum (bir kez):
#   1. codemagic.io → GitHub ile giriş → memento reposunu ekle
#   2. Teams → Integrations → App Store Connect → API anahtarını ekle,
#      adını "memento_asc" koy (App Store Connect → Users and Access → Keys)
#   3. Apple Developer'da şu kimlikler otomatik oluşturulur:
#        com.bakibacaci.memento              (uygulama)
#        com.bakibacaci.memento.MementoWidget (widget uzantısı)
#        group.com.bakibacaci.memento        (App Group — widget veri paylaşımı)
workflows:
  ios-release:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: memento_asc
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.bakibacaci.memento
        TEAM_ID: 2PLFDNRQMR
    triggering:
      events: [tag]
      tag_patterns:
        - pattern: 'v*'
    scripts:
      - name: Paketler
        script: flutter pub get
      - name: Widget hedefi + App Group + imza ayarları
        script: |
          gem install xcodeproj --no-document || true
          cd ios && ruby scripts/add_widget_target.rb
      - name: Bağımlılıklar (SPM / CocoaPods)
        script: |
          # Yeni Flutter, eklentileri Swift Package Manager ile kurar; Podfile
          # yalnızca SPM desteklemeyen eklenti varsa oluşur.
          flutter build ios --config-only --release --no-codesign
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update
          else
            echo "Podfile yok, Swift Package Manager kullanılıyor."
          fi
      - name: Apple API anahtarı (bulut imzalama için)
        script: |
          # Sertifika ve profilleri Xcode, Apple'ın bulutta yönettiği
          # dağıtım sertifikasıyla kendisi üretir (-allowProvisioningUpdates).
          # Böylece her derlemede yeni sertifika oluşmaz.
          keychain initialize
          KEY_DIR="$HOME/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          KEY_VALUE="$APP_STORE_CONNECT_PRIVATE_KEY"
          case "$KEY_VALUE" in
            @file:*) cp "${KEY_VALUE#@file:}" "$KEY_PATH" ;;
            @env:*)  VAR="${KEY_VALUE#@env:}"; printf '%s\n' "${!VAR}" > "$KEY_PATH" ;;
            *)       printf '%b\n' "$KEY_VALUE" > "$KEY_PATH" ;;
          esac
          # Gizli içeriği yazdırmadan biçimi doğrula.
          echo "Anahtar satır sayısı: $(wc -l < "$KEY_PATH")"
          if head -1 "$KEY_PATH" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "Anahtar biçimi: PEM (uygun)"
          else
            echo "Anahtar PEM değil; ilk karakterler: $(head -c 6 "$KEY_PATH" | tr -c '[:alnum:]-@:' '?')"
            exit 1
          fi
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$CM_ENV"
      - name: Derle ve imzala
        script: |
          set -e
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Build numarası: $BUILD_NUMBER"
          flutter build ios --release --no-codesign --build-number=$BUILD_NUMBER

          AUTH="-allowProvisioningUpdates             -authenticationKeyPath $ASC_KEY_PATH             -authenticationKeyID $APP_STORE_CONNECT_KEY_IDENTIFIER             -authenticationKeyIssuerID $APP_STORE_CONNECT_ISSUER_ID"

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner             -configuration Release -destination 'generic/platform=iOS'             -archivePath build/ios/Runner.xcarchive archive $AUTH

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive             -exportPath build/ios/ipa -exportOptionsPlist build/ExportOptions.plist $AUTH
          ls -la build/ios/ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Google Play için imzalı paket (AAB).
  # Kurulum: Teams → Code signing identities → Android keystores →
  # memento-upload.jks dosyasını yükle, referans adı: memento_upload
  android-release:
    name: Android → AAB
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      flutter: stable
      java: 21
      android_signing:
        - memento_upload
    scripts:
      - name: Paketler
        script: flutter pub get
      - name: İmza ayarı
        script: |
          cat > android/key.properties <<PROPS
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          PROPS
      - name: Derle
        script: flutter build appbundle --release --build-number=$((BUILD_NUMBER + 1))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
