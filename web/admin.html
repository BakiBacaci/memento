<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Memento Yönetim</title>
<style>
:root { --bg: #F5F3EE; --card: #FFFFFF; --ink: #17171A; --muted: #6B6B70; --line: #DEDAD2; --lila: #C9B6FF; --lilaInk: #2A1460; --red: #E5484D; --green: #1F8A5B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #151517; --card: #1F1F22; --ink: #F5F3EE; --muted: #A3A3A9; --line: #34343A; } }
:root[data-theme="dark"] { --bg: #151517; --card: #1F1F22; --ink: #F5F3EE; --muted: #A3A3A9; --line: #34343A; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 20px 16px 60px; max-width: 900px; margin: 0 auto; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.8px; }
.muted { color: var(--muted); }
.card { background: var(--card); border-radius: 20px; padding: 16px; margin-top: 12px; }
input, select { font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; background: var(--ink); color: var(--bg); }
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.danger { background: var(--red); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tabs { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.tabs button { background: var(--card); color: var(--ink); }
.tabs button.on { background: var(--ink); color: var(--bg); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.stat b { display: block; font-size: 28px; font-weight: 800; }
.quote { background: var(--lila); color: var(--lilaInk); border-radius: 16px; padding: 14px; font-weight: 700; font-size: 17px; line-height: 1.3; margin: 10px 0; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: var(--bg); }
.tag.open { background: #FFE27A; color: #4A3600; }
.tag.removed, .tag.banned { background: var(--red); color: #fff; }
.tag.dismissed { background: #8FE3C4; color: #07402C; }
.err { color: var(--red); margin-top: 8px; font-weight: 600; }
.hidden { display: none !important; }
</style>
</head>
<body>
<h1>Memento Yönetim</h1>
<p class="muted">Şikâyetleri incele, uygunsuz sözleri kaldır, kuralları çiğneyen hesapları yasakla. Apple ve Google, kullanıcı içeriği olan uygulamalarda şikâyetlere 24 saat içinde bakılmasını istiyor.</p>

<div id="login" class="card">
  <p style="font-weight:700; margin-bottom:10px;">Yönetici girişi</p>
  <div style="display:grid; gap:8px;">
    <input id="email" type="email" placeholder="E-posta" autocomplete="username">
    <input id="pass" type="password" placeholder="Şifre" autocomplete="current-password">
    <button id="loginBtn">Giriş yap</button>
  </div>
  <p id="loginErr" class="err"></p>
</div>

<div id="app" class="hidden">
  <div class="row" style="margin-top:12px; justify-content:space-between;">
    <span class="muted" id="who"></span>
    <button class="ghost" id="logout">Çıkış</button>
  </div>
  <div class="stats">
    <div class="card stat"><b id="sOpen">…</b><span class="muted">açık şikâyet</span></div>
    <div class="card stat"><b id="sQuotes">…</b><span class="muted">kullanıcı sözü</span></div>
    <div class="card stat"><b id="sUsers">…</b><span class="muted">kullanıcı</span></div>
  </div>
  <div class="tabs">
    <button data-tab="reports" class="on">Şikâyetler</button>
    <button data-tab="quotes">Son sözler</button>
    <button data-tab="users">Kullanıcı ara</button>
  </div>

  <div id="tab-reports">
    <div class="row" style="margin-top:12px;">
      <select id="repFilter" style="width:auto;"><option value="open">Yalnızca açık</option><option value="all">Hepsi</option></select>
      <button class="ghost" id="repReload">Yenile</button>
    </div>
    <div id="reports"></div>
  </div>
  <div id="tab-quotes" class="hidden"><div id="quotes"></div></div>
  <div id="tab-users" class="hidden">
    <div class="row" style="margin-top:12px;"><input id="uq" placeholder="Kullanıcı adı (başı yeterli)" style="flex:1;"><button id="uBtn">Ara</button></div>
    <div id="users"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, doc, getDoc, getDocs, collection, query, orderBy, limit, where, startAt, endAt, updateDoc, deleteDoc, serverTimestamp, getCountFromServer } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyAW5T85lilnvIcaZpVJ2WFFxHBKvtLx3M0',
  authDomain: 'memento-60cce.firebaseapp.com',
  projectId: 'memento-60cce',
  appId: '1:906107187459:web:65ac5d773a6bbbf6c23936',
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const REASON = { report_spam: 'Spam / reklam', report_hate: 'Nefret söylemi', report_violence: 'Şiddet / tehdit', report_sexual: 'Cinsel içerik', report_other: 'Diğer' };
const STATUS = { open: 'Açık', removed: 'Söz kaldırıldı', dismissed: 'Sorun yok', banned: 'Hesap yasaklandı' };
const when = (ts) => ts?.toDate ? ts.toDate().toLocaleString('tr-TR') : '';
const userCache = new Map();
async function user(uid) {
  if (!uid) return null;
  if (!userCache.has(uid)) userCache.set(uid, getDoc(doc(db, 'users', uid)).then((s) => s.exists() ? { uid, ...s.data() } : null).catch(() => null));
  return userCache.get(uid);
}

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value); }
  catch (e) { $('loginErr').textContent = 'Giriş yapılamadı: ' + (e.code || e.message); }
};
$('logout').onclick = () => signOut(auth);

onAuthStateChanged(auth, async (u) => {
  $('login').classList.toggle('hidden', !!u);
  $('app').classList.add('hidden');
  if (!u) return;
  const adm = await getDoc(doc(db, 'admins', u.uid)).catch(() => null);
  if (!adm?.exists()) {
    $('login').classList.remove('hidden');
    $('loginErr').textContent = 'Bu hesap yönetici değil. (UID: ' + u.uid + ')';
    await signOut(auth);
    return;
  }
  $('app').classList.remove('hidden');
  $('who').textContent = 'Yönetici: ' + (u.email || u.uid);
  loadStats(); loadReports();
});

async function loadStats() {
  const c = async (q) => (await getCountFromServer(q).catch(() => null))?.data().count ?? '–';
  $('sOpen').textContent = await c(query(collection(db, 'reports'), where('status', '==', 'open')));
  $('sQuotes').textContent = await c(collection(db, 'quotes'));
  $('sUsers').textContent = await c(collection(db, 'users'));
}

document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  ['reports', 'quotes', 'users'].forEach((t) => $('tab-' + t).classList.toggle('hidden', t !== b.dataset.tab));
  if (b.dataset.tab === 'quotes') loadQuotes();
});
$('repFilter').onchange = loadReports; $('repReload').onclick = loadReports;

async function loadReports() {
  const box = $('reports'); box.innerHTML = '<p class="muted" style="margin-top:12px">Yükleniyor…</p>';
  const snap = await getDocs(query(collection(db, 'reports'), orderBy('created_at', 'desc'), limit(150)));
  let items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  if ($('repFilter').value === 'open') items = items.filter((r) => !r.status || r.status === 'open');
  if (!items.length) { box.innerHTML = '<div class="card muted">Bekleyen şikâyet yok. 🎉</div>'; return; }
  box.innerHTML = '';
  for (const r of items) {
    const card = document.createElement('div'); card.className = 'card';
    box.appendChild(card);
    const [qs, owner, rep] = await Promise.all([
      r.quote_id ? getDoc(doc(db, 'quotes', r.quote_id)).catch(() => null) : null, user(r.owner_id), user(r.reporter_id)]);
    const q = qs?.exists() ? qs.data() : null;
    const st = r.status || 'open';
    card.innerHTML = `
      <div class="row" style="justify-content:space-between;"><b>${esc(REASON[r.reason] || r.reason)}</b><span class="tag ${st}">${STATUS[st]}</span></div>
      <div class="muted" style="font-size:13px; margin-top:4px;">${when(r.created_at)} · şikâyet eden @${esc(rep?.username || '?')} · sahibi @${esc(owner?.username || '?')}${owner?.banned ? ' (yasaklı)' : ''}</div>
      ${q ? `<div class="quote">“${esc(q.text)}”<div style="font-size:13px; font-weight:600; margin-top:6px;">— ${esc(q.author)}</div></div>` : '<p class="muted" style="margin:10px 0;">Söz artık yok (silinmiş).</p>'}
      <div class="row">
        ${q ? '<button class="danger" data-a="remove">Sözü kaldır</button>' : ''}
        ${owner && !owner.banned ? '<button class="danger" data-a="ban">Sahibini yasakla</button>' : ''}
        ${st === 'open' ? '<button class="ghost" data-a="dismiss">Sorun yok</button>' : ''}
      </div>`;
    card.querySelectorAll('button[data-a]').forEach((b) => b.onclick = async () => {
      b.disabled = true;
      try {
        const a = b.dataset.a;
        if (a === 'remove') { if (!confirm('Bu söz kalıcı olarak silinsin mi?')) { b.disabled = false; return; } await deleteDoc(doc(db, 'quotes', r.quote_id)); }
        if (a === 'ban') { if (!confirm('@' + owner.username + ' yasaklansın mı? Artık söz paylaşamaz.')) { b.disabled = false; return; } await updateDoc(doc(db, 'users', owner.uid), { banned: true, banned_at: serverTimestamp() }); userCache.delete(owner.uid); }
        await updateDoc(doc(db, 'reports', r.id), { status: a === 'remove' ? 'removed' : a === 'ban' ? 'banned' : 'dismissed', handled_at: serverTimestamp(), handled_by: auth.currentUser.uid });
        loadReports(); loadStats();
      } catch (e) { alert('Yapılamadı: ' + (e.code || e.message)); b.disabled = false; }
    });
  }
}

async function loadQuotes() {
  const box = $('quotes'); box.innerHTML = '<p class="muted" style="margin-top:12px">Yükleniyor…</p>';
  const snap = await getDocs(query(collection(db, 'quotes'), orderBy('created_at', 'desc'), limit(60)));
  box.innerHTML = '';
  snap.docs.forEach((d) => {
    const q = d.data();
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<div class="muted" style="font-size:13px;">@${esc(q.owner_username)} · ${when(q.created_at)} · ${esc(q.privacy)} · ♥ ${q.likes ?? 0}</div>
      <div class="quote">“${esc(q.text)}”<div style="font-size:13px; font-weight:600; margin-top:6px;">— ${esc(q.author)}</div></div>
      <button class="danger">Sözü kaldır</button>`;
    card.querySelector('button').onclick = async (ev) => {
      if (!confirm('Bu söz kalıcı olarak silinsin mi?')) return;
      ev.target.disabled = true;
      try { await deleteDoc(doc(db, 'quotes', d.id)); card.remove(); loadStats(); }
      catch (e) { alert('Yapılamadı: ' + (e.code || e.message)); ev.target.disabled = false; }
    };
    box.appendChild(card);
  });
}

$('uBtn').onclick = async () => {
  const t = $('uq').value.trim().toLowerCase();
  const box = $('users'); if (!t) return;
  box.innerHTML = '<p class="muted" style="margin-top:12px">Aranıyor…</p>';
  const snap = await getDocs(query(collection(db, 'users'), orderBy('username_lower'), startAt(t), endAt(t + ''), limit(20)));
  box.innerHTML = snap.empty ? '<div class="card muted">Bulunamadı.</div>' : '';
  snap.docs.forEach((d) => {
    const u = d.data();
    const card = document.createElement('div'); card.className = 'card';
    const draw = () => {
      card.innerHTML = `<div class="row" style="justify-content:space-between;">
        <div><b>@${esc(u.username)}</b> <span class="muted">${esc(u.display_name || '')}</span>${u.banned ? ' <span class="tag banned">Yasaklı</span>' : ''}
        <div class="muted" style="font-size:13px; margin-top:4px;">${u.quote_count ?? 0} söz · ${u.follower_count ?? 0} takipçi · ${u.karma ?? 0} karma</div></div>
        <button class="${u.banned ? 'ghost' : 'danger'}">${u.banned ? 'Yasağı kaldır' : 'Yasakla'}</button></div>`;
      card.querySelector('button').onclick = async (ev) => {
        if (!confirm(u.banned ? 'Yasak kaldırılsın mı?' : '@' + u.username + ' yasaklansın mı?')) return;
        ev.target.disabled = true;
        try { await updateDoc(doc(db, 'users', d.id), { banned: !u.banned, banned_at: serverTimestamp() }); u.banned = !u.banned; userCache.delete(d.id); draw(); }
        catch (e) { alert('Yapılamadı: ' + (e.code || e.message)); ev.target.disabled = false; }
      };
    };
    draw(); box.appendChild(card);
  });
};
</script>
</body>
</html>
