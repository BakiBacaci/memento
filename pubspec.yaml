name: memento
description: "Özlü söz keşfetme ve paylaşma platformu."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Arayüz ---
  flutter_card_swiper: ^7.2.0

  # --- Veri Saklama ---
  shared_preferences: ^2.5.4

  # --- Firebase ---
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # --- Profil fotoğrafı ---
  image_picker: ^1.2.1

  # --- Sözü görsel olarak paylaşma ---
  # share_plus 11'de API tamamen değişti (SharePlus.instance.share).
  # 10.x'e sabitliyoruz ki Share.shareXFiles çağrıları geçerli kalsın.
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  home_widget: ^0.10.0
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/quotes.json

  # Yazı tipi uygulamaya gömülü (SIL Open Font License, assets/fonts/OFL.txt).
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/Bricolage-Regular.ttf
        - asset: assets/fonts/Bricolage-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Bricolage-ExtraBold.ttf
          weight: 800
